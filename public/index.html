 id="listTitle">모든 레시피</h2><small id="count"></small></div><div class="filters"><div id="types" class="chips"></div><select id="sort" class="sort" aria-label="정렬"><option value="default">기본순</option><option value="quick">조리시간 짧은순</option><option value="name">이름순</option></select></div><div id="recipes" class="grid"></div><div id="empty" class="empty hidden">검색 결과가 없어요. 다른 요리나 재료를 검색해 보세요.</div></section></main><footer class="footer"><a href="photo-credits.html">사진 출처 및 라이선스</a> · 레시피 연구소 v14 · 따뜻한 집밥 디자인 · 회원가입 없이 이용하는 무료 레시피북 · 조리법과 재료량은 취향에 따라 조절하세요.</footer><nav class="mobile-tabs" aria-label="하단 메뉴"><button data-tab="home">⌂<small>홈</small></button><button data-tab="category">▦<small>카테고리</small></button><button data-tab="search">⌕<small>검색</small></button><button data-tab="favorites">♡<small>즐겨찾기</small></button><button data-tab="settings">⚙<small>설정</small></button></nav><div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="레시피 상세"><div class="panel"><button id="close" class="close" aria-label="닫기">×</button><div id="detail"></div></div></div><script>
const R=[{"id":1,"name":"김치우동","country":"일식","type":"면","emoji":"🍜","time":20,"ingredients":[{"name":"우동면","amount":1,"unit":"개"},{"name":"신김치","amount":100,"unit":"g"},{"name":"어묵","amount":1.5,"unit":"장"},{"name":"물","amount":450,"unit":"ml"},{"name":"김치국물","amount":2,"unit":"큰술"},{"name":"쯔유(3배 농축)","amount":1.5,"unit":"큰술"},{"name":"고춧가루","amount":0.5,"unit":"큰술"},{"name":"다진 마늘","amount":0.5,"unit":"큰술"},{"name":"대파","amount":0.5,"unit":"대"},{"name":"식용유","amount":0.5,"unit":"큰술"},{"name":"양파","amount":0.25,"unit":"개"}],"steps":["냄비에 식용유를 두르고 중불에서 대파 절반을 30초 볶습니다. 김치를 넣어 3~4분 볶습니다.","물, 김치국물, 쯔유, 고춧가루, 다진 마늘을 넣고 끓입니다. 끓기 시작하면 양파와 어묵을 넣어 중불에서 5분 끓입니다.","국물을 맛보고 짜면 물을 조금 더합니다. 싱거우면 쯔유를 소량 추가합니다.","우동면을 넣고 포장지에 적힌 시간만큼, 보통 2~3분 끓입니다. 남은 대파를 올립니다."],"tip":"쯔유는 농축도에 따라 양을 조절하세요. 김치가 짜면 쯔유를 줄이세요.","chef":null,"prep":["김치는 2~3cm 길이로 썰고 김치국물을 따로 계량합니다.","대파는 송송 썰어 반씩 나누고, 양파는 얇게 채 썹니다. 어묵은 1~2cm 폭으로 썹니다.","쯔유가 3배 농축 제품인지 확인하고 우동면 포장지의 조리 시간을 확인합니다."],"baseServings":1},{"id":2,"name":"김치찌개","country":"한식","type":"국·찌개","emoji":"🥘","time":35,"ingredients":[{"name":"김치","amount":150,"unit":"g"},{"name":"돼지고기","amount":100,"unit":"g"},{"name":"물","amount":300,"unit":"ml"},{"name":"두부","amount":0.25,"unit":"모"},{"name":"대파","amount":0.25,"unit":"대"},{"name":"고춧가루","amount":0.5,"unit":"큰술"},{"name":"식용유","amount":0.5,"unit":"큰술"}],"steps":["냄비에 식용유를 두르고 중불에서 돼지고기를 2~3분 볶아 겉면 색이 변하게 합니다.","김치를 넣고 3~4분 더 볶아 김치가 부드러워지게 합니다.","물을 붓고 끓어오르면 중약불로 줄여 18~20분 끓입니다. 국물이 지나치게 졸면 물을 조금 보충합니다.","고춧가루와 두부를 넣고 4분 끓인 뒤 대파를 넣어 1분 더 끓입니다. 돼지고기가 속까지 익었는지 확인합니다."],"tip":"신김치를 사용하면 맛이 깊어져요.","chef":null,"prep":["김치는 먹기 좋은 크기로 자릅니다. 돼지고기는 2~3cm 크기로 썰고 표면 물기를 닦습니다.","두부는 1.5cm 두께로, 대파는 어슷하게 썹니다. 고춧가루와 물을 미리 계량합니다."],"baseServings":1},{"id":3,"name":"된장찌개","country":"한식","type":"국·찌개","emoji":"🍲","time":25,"ingredients":[{"name":"물","amount":350,"unit":"ml"},{"name":"된장","amount":1,"unit":"큰술"},{"name":"애호박","amount":0.25,"unit":"개"},{"name":"두부","amount":0.25,"unit":"모"},{"name":"양파","amount":0.25,"unit":"개"},{"name":"다진 마늘","amount":0.25,"unit":"큰술"}],"steps":["냄비에 물을 넣고 끓기 시작하면 된장을 체나 숟가락으로 풀어줍니다.","애호박과 양파를 넣고 중불에서 8~10분 끓여 채소를 익힙니다.","두부와 다진 마늘을 넣고 4~5분 더 끓입니다. 된장의 짠맛을 확인하고 필요하면 물로 조절합니다."],"tip":"된장은 제품마다 짠맛이 달라요.","chef":null,"prep":["애호박은 0.5cm 반달 모양, 양파는 한입 크기로 썹니다.","두부는 1.5cm 주사위 모양으로 썰고 된장과 다진 마늘을 계량합니다."],"baseServings":1},{"id":4,"name":"소불고기","country":"한식","type":"고기","emoji":"🥩","time":25,"ingredients":[{"name":"소고기 불고깃감","amount":150,"unit":"g"},{"name":"간장","amount":1.5,"unit":"큰술"},{"name":"설탕","amount":0.5,"unit":"큰술"},{"name":"다진 마늘","amount":0.5,"unit":"큰술"},{"name":"양파","amount":0.25,"unit":"개"},{"name":"식용유","amount":0.5,"unit":"큰술"}],"steps":["소고기에 양념을 골고루 버무리고 10분 정도 둡니다.","팬에 식용유를 두르고 중강불에서 양파를 1분 볶습니다.","소고기를 펼쳐 넣고 3~5분 볶습니다. 덩어리를 풀어가며 속까지 익히고, 국물이 많으면 1~2분 더 졸입니다."],"tip":"기호에 따라 버섯을 더하세요.","chef":null,"prep":["불고깃감은 키친타월로 가볍게 눌러 물기를 제거하고 큰 조각만 먹기 좋게 자릅니다.","양파는 얇게 채 썰고 간장·설탕·다진 마늘을 섞어 양념을 만듭니다."],"baseServings":1},{"id":5,"name":"계란볶음밥","country":"중식","type":"밥","emoji":"🍚","time":15,"ingredients":[{"name":"밥","amount":1,"unit":"공기"},{"name":"달걀","amount":2,"unit":"개"},{"name":"대파","amount":0.5,"unit":"대"},{"name":"간장","amount":0.5,"unit":"큰술"},{"name":"식용유","amount":1,"unit":"큰술"}],"steps":["중불로 달군 팬에 식용유를 두르고 대파를 30~40초 볶아 향을 냅니다.","달걀을 붓고 젓가락으로 크게 저어 촉촉한 스크램블 상태로 만듭니다.","밥을 넣고 중강불에서 2~3분 볶아 수분을 날립니다.","팬 가장자리에 간장을 둘러 살짝 끓인 뒤 밥과 골고루 섞습니다."],"tip":"찬밥을 쓰면 고슬고슬해요.","chef":null,"prep":["밥은 한 김 식혀 주걱으로 덩어리를 풀어둡니다.","대파를 잘게 썰고 달걀을 그릇에 깨서 풀어둡니다."],"baseServings":1},{"id":6,"name":"마파두부","country":"중식","type":"반찬","emoji":"🌶️","time":25,"ingredients":[{"name":"두부","amount":0.5,"unit":"모"},{"name":"다진 돼지고기","amount":100,"unit":"g"},{"name":"두반장","amount":1,"unit":"큰술"},{"name":"물","amount":120,"unit":"ml"},{"name":"대파","amount":0.5,"unit":"대"},{"name":"식용유","amount":0.5,"unit":"큰술"},{"name":"감자전분","amount":0.5,"unit":"작은술"},{"name":"전분용 찬물","amount":1,"unit":"큰술"}],"steps":["팬에 식용유를 두르고 중불에서 대파를 30초 볶습니다. 다진 돼지고기를 넣어 3~4분 볶아 완전히 익힙니다.","두반장을 넣고 30초 볶아 향을 낸 다음 물을 붓고 끓입니다.","두부를 넣어 부서지지 않도록 살살 저으며 4~5분 끓입니다.","불을 약하게 줄이고 전분물을 다시 저어 조금씩 넣습니다. 30초~1분 끓여 소스가 걸쭉해지면 불을 끕니다."],"tip":"두반장 염도에 따라 간을 조절하세요.","chef":null,"prep":["두부는 1.5~2cm 크기로 썰고 대파는 잘게 다집니다.","감자전분과 전분용 찬물을 작은 그릇에 섞어 전분물을 만듭니다. 넣기 직전에 다시 젓습니다.","다진 돼지고기, 두반장, 물을 각각 계량합니다."],"baseServings":1},{"id":7,"name":"토마토 달걀볶음","country":"중식","type":"반찬","emoji":"🍅","time":12,"ingredients":[{"name":"토마토","amount":1,"unit":"개"},{"name":"달걀","amount":2,"unit":"개"},{"name":"소금","amount":0.2,"unit":"작은술"},{"name":"식용유","amount":1,"unit":"큰술"},{"name":"설탕","amount":0.25,"unit":"작은술"}],"steps":["팬에 식용유 절반을 두르고 중약불에서 달걀을 부드럽게 스크램블한 뒤 접시에 덜어둡니다.","같은 팬에 남은 식용유를 두르고 토마토를 중불에서 2~3분 볶아 즙을 냅니다.","달걀을 다시 넣고 남은 소금과 설탕을 넣어 30초~1분 가볍게 섞어 마무리합니다."],"tip":"토마토가 너무 무르지 않게 볶아요.","chef":null,"prep":["토마토는 꼭지를 제거하고 6~8조각으로 썹니다.","달걀에 소금 절반을 넣고 풀어둡니다. 남은 소금과 설탕은 따로 계량합니다."],"baseServings":1},{"id":8,"name":"쇼유라멘","country":"일식","type":"면","emoji":"🍥","time":30,"ingredients":[{"name":"라멘 생면","amount":1,"unit":"인분"},{"name":"닭육수","amount":450,"unit":"ml"},{"name":"간장","amount":1.5,"unit":"큰술"},{"name":"미림","amount":0.5,"unit":"큰술"},{"name":"삶은 달걀","amount":1,"unit":"개"},{"name":"대파","amount":0.25,"unit":"대"},{"name":"면 삶는 물","amount":1000,"unit":"ml"}],"steps":["냄비에 닭육수와 간장, 미림을 넣고 끓인 뒤 약불로 유지합니다. 2~3분 끓여 맛을 섞습니다.","다른 냄비에서 면 삶는 물을 끓이고 생면을 제품 표시 시간대로 삶습니다.","면을 체에 건져 물기를 털어 그릇에 담고 뜨거운 육수를 붓습니다.","달걀과 대파를 올려 즉시 냅니다. 국물이 짜면 뜨거운 물을 소량 더합니다."],"tip":"간단 가정식 버전이며 전문점의 장시간 우린 육수와는 달라요.","chef":null,"prep":["대파는 송송 썰고 삶은 달걀은 반으로 가릅니다.","면 삶는 물을 별도 냄비에 준비하고 닭육수·간장·미림을 계량합니다."],"baseServings":1},{"id":9,"name":"오야코동","country":"일식","type":"밥","emoji":"🍛","time":20,"ingredients":[{"name":"밥","amount":1,"unit":"공기"},{"name":"닭다리살","amount":120,"unit":"g"},{"name":"달걀","amount":2,"unit":"개"},{"name":"양파","amount":0.25,"unit":"개"},{"name":"쯔유(3배 농축)","amount":1,"unit":"큰술"},{"name":"물","amount":100,"unit":"ml"}],"steps":["작은 팬에 물과 쯔유, 양파를 넣고 중불에서 2~3분 끓입니다.","닭고기를 넣고 뚜껑을 덮어 5~7분 끓입니다. 전히 익혀주세요.","chef":null,"prep":["닭고기는 뼈 유무와 두께를 확인합니다. 생닭은 씻어 물을 튀기지 말고 별도 도마에서 다룹니다.","대파는 큼직하게 자르고 마늘은 껍질을 벗깁니다."],"baseServings":1},{"id":16,"name":"돼지고기 제육볶음","country":"한식","type":"고기","emoji":"🥓","time":25,"ingredients":[{"name":"돼지고기 앞다리살","amount":150,"unit":"g"},{"name":"고추장","amount":0.5,"unit":"큰술"},{"name":"고춧가루","amount":0.5,"unit":"큰술"},{"name":"간장","amount":1,"unit":"큰술"},{"name":"설탕","amount":0.5,"unit":"큰술"},{"name":"양파","amount":0.25,"unit":"개"},{"name":"식용유","amount":0.5,"unit":"큰술"}],"steps":["돼지고기에 양념을 넣고 골고루 버무려 5~10분 둡니다.","팬에 식용유를 두르고 중강불에서 양념한 고기를 3~4분 볶습니다.","양파를 넣고 3~4분 더 볶아 고기 속까지 익힙니다. 팬이 너무 마르면 불을 낮추고 물을 한두 숟가락 보충할 수 있습니다."],"tip":"고기 두께에 따라 조리시간을 조절하세요.","chef":null,"prep":["돼지고기는 한입 크기로 썰고 양파는 0.5cm 두께로 채 썹니다.","고추장·고춧가루·간장·설탕을 한 그릇에 섞어 양념을 만듭니다."],"baseServings":1},{"id":17,"name":"새우볶음밥","country":"중식","type":"밥","emoji":"🍤","time":18,"ingredients":[{"name":"밥","amount":1,"unit":"공기"},{"name":"새우","amount":100,"unit":"g"},{"name":"달걀","amount":1,"unit":"개"},{"name":"대파","amount":0.5,"unit":"대"},{"name":"간장","amount":0.5,"unit":"큰술"},{"name":"식용유","amount":1,"unit":"큰술"}],"steps":["팬에 식용유 절반을 두르고 중강불에서 새우를 2~3분 볶아 불투명해지고 완전히 익으면 덜어둡니다.","남은 식용유를 넣고 대파를 30초 볶다가 달걀을 넣어 스크램블합니다.","밥을 넣어 2분 볶고 익혀둔 새우를 다시 넣습니다.","간장을 팬 가장자리에 둘러 가볍게 끓인 뒤 전체를 섞어 1분 더 볶습니다."],"tip":"새우 알레르기가 있다면 다른 단백질로 바꾸세요.","chef":null,"prep":["새우는 냉동 상태라면 냉장 해동하고 키친타월로 물기를 닦습니다. 필요하면 내장을 제거합니다.","대파는 송송 썰고 달걀은 풀어둡니다. 밥은 덩어리를 풀어 준비합니다."],"baseServings":1},{"id":18,"name":"규동","country":"일식","type":"밥","emoji":"🍚","time":20,"ingredients":[{"name":"밥","amount":1,"unit":"공기"},{"name":"소고기 얇은 슬라이스","amount":120,"unit":"g"},{"name":"양파","amount":0.5,"unit":"개"},{"name":"쯔유(3배 농축)","amount":1.5,"unit":"큰술"},{"name":"물","amount":120,"unit":"ml"},{"name":"설탕","amount":0.25,"unit":"작은술"}],"steps":["작은 팬에 쯔유·물·설탕과 양파를 넣고 중불에서 3~4분 끓입니다.","소고기를 한 장씩 풀어 넣고 3~5분 끓여 속까지 익힙니다. 표면에 생기는 거품은 필요하면 걷어냅니다.","국물이 약간 남았을 때 불을 끄고 밥 위에 소고기와 양파를 올립니다."],"tip":"쯔유 제품에 따라 짠맛을 조절하세요.","chef":null,"prep":["양파는 얇게 채 썰고 소고기는 긴 조각만 먹기 좋게 자릅니다.","쯔유, 물, 설탕을 미리 섞고 밥을 따뜻하게 준비합니다."],"baseServings":1},{"id":19,"name":"감자수프","country":"양식","type":"국·찌개","emoji":"🥣","time":30,"ingredients":[{"name":"감자","amount":1,"unit":"개"},{"name":"양파","amount":0.25,"unit":"개"},{"name":"우유","amount":200,"unit":"ml"},{"name":"물","amount":100,"unit":"ml"},{"name":"버터","amount":10,"unit":"g"},{"name":"소금","amount":0.2,"unit":"작은술"}],"steps":["냄비에 버터를 녹이고 중불에서 양파를 2~3분 볶습니다.","감자를 넣어 1분 볶은 뒤 물을 붓고 뚜껑을 덮어 10~15분 끓입니다. 감자가 포크로 쉽게 으깨지면 됩니다.","불을 끄고 한 김 식힌 뒤 핸드블렌더로 곱게 갑니다. 일반 믹서를 쓴다면 충분히 식혀 소량씩 갈아 화상을 피합니다.","우유를 넣고 약불에서 2~3분 데운 뒤 소금으로 간합니다. 우유를 넣은 뒤 세게 끓이지 않습니다."],"tip":"뜨거운 재료를 믹서에 갈 때 화상에 주의하세요.","chef":null,"prep":["감자는 껍질을 벗겨 1~2cm 크기로 썰고 양파는 얇게 채 썹니다.","우유와 물을 계량하고 버터·소금을 준비합니다."],"baseServings":1},{"id":20,"name":"계란말이","country":"한식","type":"반찬","emoji":"🍳","time":15,"ingredients":[{"name":"달걀","amount":3,"unit":"개"},{"name":"대파","amount":0.25,"unit":"대"},{"name":"소금","amount":0.2,"unit":"작은술"},{"name":"식용유","amount":0.5,"unit":"큰술"}],"steps":["팬을 약불로 예열하고 식용유를 얇게 펴 바릅니다.","달걀물을 얇게 붓고 표면이 거의 익으면 한쪽 끝부터 말아줍니다.","말아둔 달걀을 팬 끝으로 밀고 빈 공간에 달걀물을 조금 더 부어 이어서 맙니다. 달걀물이 없어질 때까지 반복합니다.","불을 끄고 1~2분 식힌 뒤 먹기 좋은 두께로 썹니다."],"tip":"약불로 조리하면 모양이 잘 잡혀요.","chef":null,"prep":["대파는 아주 잘게 썰고 달걀은 그릇에 풀어 소금과 대파를 섞습니다.","식용유를 준비하고 뒤집개와 작은 팬을 사용하면 말기 편합니다."],"baseServings":1},{"id":21,"name":"연어 데리야끼 스테이크","country":"일식","type":"고기","emoji":"🐟","time":25,"ingredients":[{"name":"연어 스테이크용","amount":300,"unit":"g"},{"name":"청주","amount":6,"unit":"큰술"},{"name":"맛술","amount":6,"unit":"큰술"},{"name":"설탕","amount":6,"unit":"큰술"},{"name":"간장","amount":5,"unit":"큰술"},{"name":"꽈리고추","amount":4,"unit":"개"},{"name":"식용유","amount":2,"unit":"큰술"}],"prep":["연어는 키친타월로 물기를 닦습니다. 껍질이 있다면 그대로 둡니다.","꽈리고추는 씻어 꼭지를 다듬고, 청주·맛술·설탕·간장을 각각 계량합니다."],"steps":["팬에 식용유를 두르고 중불로 예열한 다음 연어 껍질 쪽을 아래로 놓고 노릇하게 굽습니다.","뒤집어서 반대쪽도 약 3분 굽되, 연어 두께에 따라 시간을 조절해 속까지 익힙니다. 구운 연어를 접시에 잠시 옮깁니다.","같은 팬의 기름이 지나치게 많으면 조금 닦아낸 뒤 청주·맛술·설탕을 넣어 녹이고 간장을 더해 끓입니다.","연어를 다시 넣고 소스를 끼얹으며 윤기가 돌도록 졸입니다. 꽈리고추를 넣어 살짝 익힌 뒤 담아냅니다."],"tip":"소스가 달고 진한 편이므로 처음에는 적게 끼얹어 맛을 보세요.","chef":"정호영","sourceUrl":"https://www.youtube.com/watch?v=AC1dWChpIwk","sourceTitle":"정호영의 오늘도 요리 · 셰프 추천 요리 Top5","baseServings":2,"sourceNote":"원본은 연어 중량과 식용유 양을 특정하지 않아 2인분 기준 연어 300g·식용유 2큰술을 연구소에서 보완했습니다."},{"id":22,"name":"오이볶음","country":"한식","type":"반찬","emoji":"🥒","time":20,"ingredients":[{"name":"오이","amount":3,"unit":"개"},{"name":"소금(절임용)","amount":3,"unit":"큰술"},{"name":"홍고추","amount":1,"unit":"개"},{"name":"다진 마늘","amount":1,"unit":"큰술"},{"name":"참치액","amount":1,"unit":"큰술"},{"name":"고춧가루","amount":1,"unit":"큰술"},{"name":"들기름","amount":1,"unit":"큰술"},{"name":"식용유","amount":1,"unit":"큰술"}],"prep":["오이를 얇게 썰어 소금에 절입니다. 오이가 숨이 죽으면 물에 충분히 헹궈 짠맛을 빼고 물기를 꼭 짭니다.","홍고추는 송송 썰고 다진 마늘과 나머지 양념을 준비합니다."],"steps":["팬에 식용유를 두르고 중불에서 다진 마늘을 짧게 볶아 향을 냅니다.","물기를 짠 오이를 넣고 수분이 날아가도록 볶습니다.","참치액과 고춧가루를 넣어 고루 섞으며 볶습니다.","불을 끄기 직전에 들기름과 홍고추를 넣어 가볍게 섞어 마무리합니다."],"tip":"절인 오이를 충분히 헹구지 않으면 짜질 수 있어요.","chef":"정호영","sourceUrl":"https://www.youtube.com/watch?v=AC1dWChpIwk","sourceTitle":"정호영의 오늘도 요리 · 셰프 추천 요리 Top5","baseServings":3,"sourceNote":"원본 영상 조리 단계에 식용유가 등장하지만 재료표에는 빠져 있어 연구소에서 1큰술을 보완했습니다. 절임 소금은 씻어내므로 완성 음식에 전량 남지 않습니다."},{"id":23,"name":"멸치볶음","country":"한식","type":"반찬","emoji":"🐟","time":15,"ingredients":[{"name":"잔멸치","amount":100,"unit":"g"},{"name":"청양고추","amount":2,"unit":"개"},{"name":"식용유","amount":3,"unit":"큰술"},{"name":"설탕","amount":1,"unit":"큰술"},{"name":"맛술","amount":2,"unit":"큰술"},{"name":"물엿","amount":2,"unit":"큰술"},{"name":"간장","amount":1,"unit":"큰술"},{"name":"통깨","amount":1,"unit":"작은술"},{"name":"참기름","amount":1,"unit":"작은술"}],"prep":["청양고추는 송송 썰고, 설탕·맛술·물엿·간장을 계량합니다.","멸치에 큰 이물질이 없는지 살펴봅니다."],"steps":["기름을 두르지 않은 팬에 멸치를 중약불로 볶아 비린 향과 수분을 날립니다.","식용유를 넣고 고루 섞은 다음 설탕과 맛술을 넣어 볶습니다.","물엿을 넣고 타지 않도록 뒤적이다가 간장을 넣어 간을 맞춥니다.","불을 끄고 청양고추를 넣어 잔열로 섞은 다음 통깨와 참기름을 넣어 마무리합니다."],"tip":"멸치의 염도에 따라 간장을 조금 줄여도 좋아요.","chef":"정호영","sourceUrl":"https://www.youtube.com/watch?v=AC1dWChpIwk","sourceTitle":"정호영의 오늘도 요리 · 셰프 추천 요리 Top5","baseServings":4,"sourceNote":"원본은 통깨·참기름 양을 명시하지 않아 각각 1작은술로 보완했습니다."},{"id":24,"name":"옛날 떡볶이","country":"한식","type":"간식","emoji":"🍢","time":25,"ingredients":[{"name":"떡볶이 떡","amount":400,"unit":"g"},{"name":"물","amount":1000,"unit":"ml"},{"name":"어묵","amount":5,"unit":"장"},{"name":"대파","amount":1,"unit":"대"},{"name":"감자전분","amount":1,"unit":"큰술"},{"name":"전분 풀 물","amount":2,"unit":"큰술"},{"name":"고춧가루","amount":2,"unit":"큰술"},{"name":"설탕","amount":4,"unit":"큰술"},{"name":"간장","amount":1,"unit":"큰술"},{"name":"고추장","amount":2,"unit":"큰술"},{"name":"미원","amount":0.5,"unit":"큰술"},{"name":"다시다","amount":0.5,"unit":"큰술"}],"prep":["떡이 딱딱하면 찬물에 잠시 담가 풀어줍니다. 어묵은 한입 크기로 썰고 대파는 어슷 썹니다.","감자전분은 별도 그릇에 찬물 2큰술과 섞어 전분물을 준비합니다."],"steps":["냄비에 물과 떡, 어묵을 넣고 끓입니다.","고춧가루·설탕·간장·고추장을 넣고 풀어준 뒤 미원·다시다를 더합니다.","떡이 부드러워질 때까지 끓입니다. 전분물은 넣기 직전 다시 저어 가라앉은 전분을 풀어줍니다.","국물이 끓는 상태에서 전분물을 조금씩 부어 저으며 농도를 맞추고 대파를 넣어 살짝 익힙니다."],"tip":"원본은 레이먼 킴 셰프의 조리법을 참고했다고 밝힙니다. 감자전분은 한꺼번에 넣지 말고 농도를 보며 조절하세요.","chef":"정호영","sourceUrl":"https://www.youtube.com/watch?v=AC1dWChpIwk","sourceTitle":"정호영의 오늘도 요리 · 셰프 추천 요리 Top5","baseServings":4,"sourceNote":"원본 어묵은 4~7장으로 안내되어 중간값 5장으로 표기했고, 전분을 풀 물 2큰술은 연구소 보완량입니다. 원본에 미원·다시다가 모두 포함됩니다."},{"id":25,"name":"당근 라페 타파스","country":"양식","type":"간식","emoji":"🥕","time":25,"ingredients":[{"name":"당근","amount":2,"unit":"개"},{"name":"소금(절임용)","amount":1,"unit":"큰술"},{"name":"아보카도","amount":1,"unit":"개"},{"name":"크림치즈","amount":50,"unit":"g"},{"name":"꿀","amount":1,"unit":"작은술"},{"name":"바게트","amount":8,"unit":"조각"},{"name":"설탕","amount":1,"unit":"큰술"},{"name":"레몬즙","amount":1,"unit":"큰술"},{"name":"올리브유(라페용)","amount":2,"unit":"큰술"},{"name":"올리브유(마무리)","amount":1,"unit":"작은술"},{"name":"후추","amount":1,"unit":"꼬집"},{"name":"홀그레인 머스터드","amount":1.5,"unit":"큰술"}],"prep":["당근을 가늘게 채 썰어 소금으로 10~15분 절인 뒤 물기를 꽉 짭니다.","아보카도는 껍질과 씨를 제거하고 얇게 썹니다. 바게트는 한입 크기로 썰어 준비합니다."],"steps":["절인 당근에 설탕·레몬즙·라페용 올리브유·후추·홀그레인 머스터드를 넣고 골고루 버무립니다.","크림 const photoCache = {};
function applyPhoto(r){
 const p=photoCache[r.id];if(!p)return;
 document.querySelectorAll('[data-photo="'+r.id+'"]').forEach(el=>{
  if(el.querySelector('img'))return;
  const img=document.createElement('img');img.src=p.url;img.alt=r.name+' 완성 요리 참고 이미지';img.loading='lazy';
  img.onload=()=>{el.classList.add('has-photo');};img.onerror=()=>{img.remove();el.classList.remove('has-photo');};el.prepend(img);
 });
 const a=document.getElementById('photoCredit');
 if(a&&selected?.id===r.id){a.textContent=p.credit;if(p.source){a.href="photo-credits.html#photo-"+r.id}else{a.removeAttribute('href')}}
}
function fetchPhoto(r){
 const p=REVIEWED_PHOTOS[r.id];
 if(!p)return Promise.resolve(null);
 photoCache[r.id]=p;applyPhoto(r);return Promise.resolve(p);
}
function loadPhotos(list){list.forEach(fetchPhoto)}

 let list=R.filter(r=>(country==='전체'||r.country===country)&&(type==='전체'||r.type===type)&&(chef==='전체'||r.chef===chef)&&(!favsOnly||favorites.includes(r.id))&&(!q||[r.name,r.country,r.type,r.chef||'',...r.ingredients.map(x=>x.name)].join(' ').toLowerCase().includes(q)));if($('sort').value==='quick')list.sort((a,b)=>a.time-b.time);if($('sort').value==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'ko'));$('listTitle').textContent=q?'검색 결과':favsOnly?'내 즐겨찾기':chef!=='전체'?chef+' 레시피':country==='전체'?'모든 레시피':country+' 레시피';$('count').textContent=list.length+'개의 레시피';$('recipes').innerHTML=list.map(r=>`<article class="recipe" data-id="${r.id}" tabindex="0" role="button" aria-label="${r.name} 레시피 보기"><div class="visual" data-photo="${r.id}"><span class="food-placeholder">${r.name}</span>${REVIEWED_PHOTOS[r.id]?'':''}<button class="heart ${favorites.includes(r.id)?'saved':''}" data-fav="${r.id}" aria-label="즐겨찾기">${favorites.includes(r.id)?'♥':'♡'}</button></div><div class="recipe-info"><span class="tag">${r.country} · ${r.type}${r.chef?' · '+r.chef:''}</span><h3>${r.name}</h3><p>⏱ ${r.time}분 · 쉬운 가정식</p></div></article>`).join('');$('empty').classList.toggle('hidden',list.length>0);loadPhotos(list);$('recipes').querySelectorAll('.recipe').forEach(el=>{el.onclick=e=>{if(e.target.closest('[data-fav]')){toggleFav(+el.dataset.id);return}openRecipe(+el.dataset.id)};el.onkeydown=e=>{if(e.key==='Enter')openRecipe(+el.dataset.id)}})}function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save();draw();if(selected?.id===id)detail()}function fmt(n){return Number(n.toFixed(2)).toLocaleString('ko-KR')}function detail(){let r=selected;$('detail').innerHTML=`<div class="detail-photo" data-photo="${r.id}"><span class="food-placeholder">${r.name}</span>${REVIEWED_PHOTOS[r.id]?'':''}</div><div class="detail-head"><span class="tag">${r.country} · ${r.type}${r.chef?' · '+r.chef:''}</span><h2>${r.name}</h2><div class="detail-meta">⏱ 약 ${r.time}분 · 가정식 레시피</div></div><div class="detail-body"><a class="photo-credit" id="photoCredit" target="_blank" rel="noopener"></a><div class="portion"><b>인분 조절</b><button id="minus">−</button><strong>${servings}인분</strong><button id="plus">+</button></div><h3>준비 재료</h3>${r.ingredients.map(x=>`<div class="ingredient"><span>${x.name}</span><b>${fmt(x.amount*servings/(r.baseServings||1))} ${x.unit}</b></div>`).join('')}<h3>재료 손질 · 사전 준비</h3><ol class="steps">${prepFor(r).map(s=>`<li>${s}</li>`).join('')}</ol><h3>차근차근 조리하기</h3><ol class="steps cook-steps">${stepsFor(r).map(s=>`<li><label class="step-check"><input type="checkbox"><span>${s}</span></label></li>`).join('')}</ol><h3>연구소 팁</h3><div class="note">💡 ${r.tip}</div><p class="source">※ 재료는 ${r.baseServings||1}인분 기준으로 작성되었고 인분 변경 시 비례 계산됩니다. 조리 시간은 화력과 양에 따라 달라집니다. ${r.chef?'공개된 원본을 참고해 연구소가 새로 정리한 조리 안내이며 셰프의 공식 인증을 받은 콘텐츠는 아닙니다.':'연구소 자체 작성 기본 레시피입니다.'}</p>${r.sourceNote?'<p class="source">검수 메모: '+r.sourceNote+'</p>':''}${r.sourceUrl?'<p><a class="source-link" href="'+r.sourceUrl+'" target="_blank" rel="noopener noreferrer">▶ 원본 영상 확인 · '+r.sourceTitle+'</a></p>':''}<div class="actions"><button class="primary" id="detailFav">${favorites.includes(r.id)?'♥ 즐겨찾기 해제':'♡ 즐겨찾기 저장'}</button><button class="secondary" id="copy">재료 목록 복사</button><button class="secondary" id="print">인쇄하기</button></div></div>`;if(photoCache[r.id]){const p=photoCache[r.id];const el=document.querySelector('#detail [data-photo]');if(el){const img=document.createElement('img');img.src=p.url;img.alt=r.name+' 음식 참고 사진';el.prepend(img);el.classList.add('has-photo')}const a=$('photoCredit');if(p.source){a.href="photo-credits.html#photo-"+r.id}else{a.removeAttribute('href')}a.textContent=p.credit}else fetchPhoto(r);document.querySelectorAll('.step-check input').forEach(x=>x.addEventListener('change',()=>x.closest('li').classList.toggle('done',x.checked)));$('minus').onclick=()=>{servings=Math.max(1,servings-1);detail()};$('plus').onclick=()=>{servings=Math.min(12,servings+1);detail()};$('detailFav').onclick=()=>toggleFav(r.id);$('copy').onclick=async()=>{let t=`${r.name} (${servings}인분)\n`+r.ingredients.map(x=>`${x.name}: ${fmt(x.amount*servings/(r.baseServings||1))} ${x.unit}`).join('\n');try{await navigator.clipboard.writeText(t);$('copy').textContent='복사 완료!'}catch{window.prompt('재료 목록을 복사하세요',t)}};$('print').onclick=()=>window.print()}function openRecipe(id){selected=R.find(r=>r.id===id);servings=2;detail();$('modal').classList.add('open');document.body.style.overflow='hidden'}function close(){ $('modal').classList.remove('open');document.body.style.overflow='';selected=null}function updateNav(){$('allBtn').classList.toggle('active',!favsOnly);$('favBtn').classList.toggle('active',favsOnly)}$('allBtn').onclick=()=>{favsOnly=false;country='전체';type='전체';chef='전체';updateNav();draw()};$('favBtn').onclick=()=>{favsOnly=true;country='전체';type='전체';chef='전체';updateNav();draw()};$('search').oninput=draw;
$('search').form.onsubmit=event=>{
 event.preventDefault();
 draw();
 if($('search').value.trim()) $('search').form.scrollIntoView({block:'start'});
};
$('sort').onchange=draw;$('close').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});draw();
function positionRecipeResults(searching){
 const discovery=$('recipeDiscovery'), results=$('recipeResults');
 if(searching && discovery.previousElementSibling!==results) discovery.before(results);
 if(!searching && discovery.nextElementSibling!==results) discovery.after(results);
}
function warmHomeInit(){
 const top=[2,1,15,14,8].map(id=>R.find(r=>r.id===id)).filter(Boolean);
 const grid=document.getElementById('popularGrid');
 grid.innerHTML=top.map((r,i)=>`<button class="popular-item" data-pop="${r.id}"><div class="popular-image" data-pop-photo="${r.id}"><span class="food-placeholder">${r.name}</span></div><div class="popular-label"><span class="rank">${i+1}</span><span>${r.name}</span></div></button>`).join('');
 grid.querySelectorAll('[data-pop]').forEach(b=>b.onclick=()=>openRecipe(+b.dataset.pop));
 const groups=[['국·찌개',2,'국·찌개'],['밥·면 요리',8,'면'],['고기 요리',4,'고기'],['반찬·무침',7,'반찬'],['간단 요리',7,'전체'],['아침·브런치',14,'간식'],['일식·면 요리',8,'면'],['셰프·방송 레시피',25,'전체']];
 const gallery=document.getElementById('categoryGallery');
 gallery.innerHTML=groups.map(([label,id,t])=>`<button class="category-tile" data-category-type="${t}"><span>${label}</span></button>`).join('');
 gallery.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{type=groups[i][2];country='전체';chef='전체';favsOnly=false;updateNav();draw();document.getElementById('recipes').scrollIntoView({behavior:'smooth'})});
 function photoFor(id,el){const p=REVIEWED_PHOTOS[id];if(!p||!p.url)return;const img=new Image();img.onload=()=>{if(el.classList.contains('popular-image'))el.textContent='';el.prepend(img);el.classList.remove('no-image')};img.onerror=()=>{};img.src=p.url}
 top.forEach(r=>{const el=grid.querySelector(`[data-pop-photo="${r.id}"]`);if(el)photoFor(r.id,el)});
 groups.forEach((g,i)=>{const el=gallery.children[i];el.classList.add('no-image');photoFor(g[1],el)});
 const tabs=document.querySelectorAll('.mobile-tabs button');function activate(b){tabs.forEach(x=>x.classList.toggle('active',x===b))}
 tabs.forEach(b=>b.onclick=()=>{activate(b);const t=b.dataset.tab;if(t==='home'){document.getElementById('allBtn').click();window.scrollTo({top:0,behavior:'smooth'})}if(t==='category')document.getElementById('categoryHeading').scrollIntoView({behavior:'smooth'});if(t==='search'){document.getElementById('search').form.scrollIntoView({behavior:'smooth'});document.getElementById('search').focus({preventScroll:true})}if(t==='favorites'){document.getElementById('favBtn').click();document.getElementById('recipes').scrollIntoView({behavior:'smooth'})}if(t==='settings')alert('레시피 연구소 v14 · 따뜻한 집밥 디자인\n레시피 25개 · 검색·즐겨찾기·인분 조절 지원')});activate(tabs[0]);
}
warmHomeInit();
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));} if('caches' in window){caches.keys().then(ks=>ks.filter(k=>k.startsWith('recipe-lab-')).forEach(k=>caches.delete(k)));}

// v13: shopping list and favorites backup. No external services; stored on this device.
(function(){
 const key='recipeLabShoppingV13';
 const read=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}};
 const write=x=>{try{localStorage.setItem(key,JSON.stringify(x))}catch{}};
 const wholePurchaseUnits=new Set(['개','장','대','모','마리']);
 function shoppingLabel(key,label){
  const [name,unit]=key.split('|');
  if(!wholePurchaseUnits.has(unit) || !label.startsWith(name+' ') || !label.endsWith(' '+unit)) return label;
  const quantity=Number(label.slice(name.length+1,-unit.length-1));
  if(!Number.isFinite(quantity) || quantity<=0 || Number.isInteger(quantity)) return label;
  return `${name} ${Math.ceil(quantity)}${unit} (필요량 ${quantity}${unit})`;
 }
 const safe=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const toolbar=document.createElement('div');toolbar.className='v13-tools';
 toolbar.innerHTML='<button type="button" id="v13Shopping">🛒 장보기 목록</button><button type="button" id="v13Backup">♡ 즐겨찾기 백업</button><button type="button" id="v13Restore">↥ 즐겨찾기 복원</button><input id="v13File" type="file" accept="application/json,.json" hidden>';
 const search=document.querySelector('.search');if(search)search.insertAdjacentElement('afterend',toolbar);
 const panel=document.createElement('section');panel.className='v13-panel hidden';panel.id='v13Panel';toolbar.insertAdjacentElement('afterend',panel);
 function download(name,data){const blob=new Blob([data],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
 function render(){const data=read(),entries=Object.entries(data);panel.innerHTML='<h3>우리 집 장보기 목록</h3><div class="v13-count">'+entries.filter(([k,v])=>!v.done).length+'개 남음 · 기기에 저장됩니다</div>'+(entries.length?entries.map(([k,v])=>'<label><input type="checkbox" data-shop="'+safe(k)+'" '+(v.done?'checked':'')+'><span class="'+(v.done?'checked':'')+'">'+safe(shoppingLabel(k,v.label))+'</span></label>').join(''):'<p>레시피 상세 화면에서 「장보기 목록에 담기」를 눌러주세요.</p>')+'<div class="v13-actions"><button id="v13Copy" type="button">목록 복사</button><button id="v13Clear" type="button">완료 항목 지우기</button><button id="v13Close" type="button">닫기</button></div>';
 panel.querySelectorAll('[data-shop]').forEach(el=>el.onchange=()=>{const x=read();if(x[el.dataset.shop])x[el.dataset.shop].done=el.checked;write(x);render()});
 panel.querySelector('#v13Clear').onclick=()=>{const x=read();Object.keys(x).forEach(k=>{if(x[k].done)delete x[k]});write(x);render()};
 panel.querySelector('#v13Close').onclick=()=>panel.classList.add('hidden');
 panel.querySelector('#v13Copy').onclick=async()=>{const t=Object.entries(read()).filter(([,item])=>!item.done).map(([key,item])=>'□ '+shoppingLabel(key,item.label)).join('\n');try{await navigator.clipboard.writeText(t);alert('장보기 목록을 복사했어요.')}catch{prompt('복사하세요',t)}};
 }
 document.getElementById('v13Shopping').onclick=()=>{render();panel.classList.toggle('hidden');if(!panel.classList.contains('hidden'))panel.scrollIntoView({behavior:'smooth',block:'center'})};
 document.getElementById('v13Backup').onclick=()=>{let ids=[];try{ids=JSON.parse(localStorage.getItem('recipeLabFavorites')||'[]')}catch{}download('recipe-lab-favorites.json',JSON.stringify({app:'recipe-lab',version:1,favorites:ids},null,2))};
 const input=document.getElementById('v13File');document.getElementById('v13Restore').onclick=()=>input.click();
 input.onchange=async()=>{try{const obj=JSON.parse(await input.files[0].text());if(obj.app!=='recipe-lab'||!Array.isArray(obj.favorites))throw Error('파일 형식이 맞지 않습니다');const ids=[...new Set(obj.favorites.filter(Number.isInteger))];if(!confirm('현재 즐겨찾기를 백업 파일의 '+ids.length+'개 항목으로 바꿀까요?'))return;localStorage.setItem('recipeLabFavorites',JSON.stringify(ids));location.reload()}catch(e){alert('복원할 수 없습니다: '+e.message)}finally{input.value=''}};
 // Attach to the existing detail rendering without modifying recipe data or portion calculations.
 const orig=window.detail;if(typeof orig==='function'){
 window.detail=function(){orig();const actions=document.querySelector('#detail .actions');if(!actions)return;
 const b=document.createElement('button');b.type='button';b.className='v13-shop-btn';b.textContent='🛒 장보기 목록에 담기';actions.prepend(b);
 b.onclick=()=>{if(!selected)return;const r=selected,x=read();r.ingredients.forEach(i=>{const amount=Number((i.amount*servings/(r.baseServings||1)).toFixed(2));const label=i.name+' '+amount+' '+i.unit;const k=i.name+'|'+i.unit;x[k]={label,done:false}});write(x);b.textContent='✓ 장보기 목록에 담았어요';};
 }
 }
})();
</script></body></html>
