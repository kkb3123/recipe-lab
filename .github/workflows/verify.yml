name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  DEVELOPMENT_PREVIEW_URL: https://dev--fanciful-wisp-355a46.netlify.app/
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run tests
        id: checks
        run: npm test
      - name: Record development update
        if: ${{ always() }}
        env:
          TEST_OUTCOME: ${{ steps.checks.outcome }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/development-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  preview:
    name: Publish development preview
    needs: test
    if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment:
      name: netlify-preview
      url: https://dev--fanciful-wisp-355a46.netlify.app/
    concurrency:
      group: netlify-development-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish current main to dev alias
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          set -eu
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo "status=더 최신 커밋이 있어 게시를 건너뜀" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          : "${NETLIFY_AUTH_TOKEN:?Configure the netlify-preview environment secret}"
          : "${NETLIFY_SITE_ID:?Configure the netlify-preview environment variable}"
          env -u NETLIFY_DEPLOY_TO_PROD npx --yes netlify-cli@27.20.1 deploy --alias dev --no-build --dir=public --site="$NETLIFY_SITE_ID"
          echo "status=게시 완료" >> "$GITHUB_OUTPUT"
      - name: Record preview result
        if: ${{ always() }}
        env:
          PUBLISH_STATUS: ${{ steps.publish.outputs.status }}
        run: |
          printf '## 개발 미리보기 게시\n\n- 상태 — %s\n- 주소 — %s\n' \
            "${PUBLISH_STATUS:-게시 실패 또는 중단}" "$DEVELOPMENT_PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
